baseURL = "https://ice-littlefire.github.io/hugo-theme-reimu/"
title = "ice-littlefire 的学习笔记"
theme = "reimu"
languageCode = "zh-CN"
defaultContentLanguage = "zh-CN"
hasCJKLanguage = true
timeZone = "Asia/Shanghai"

[languages]
  [languages.zh-CN]
    languageName = "简体中文"
    weight = 1
    hasCJKLanguage = true

[pagination]
  pagerSize = 10

[markup]
  [markup.highlight]
    guessSyntax = true
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[caches]
  [caches.images]
    dir = ":cacheDir/images"

[taxonomies]
  category = "categories"
  tag = "tags"
